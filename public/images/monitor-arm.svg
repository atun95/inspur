<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f7ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="ascreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a52"/>
      <stop offset="1" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="aarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#abg)"/>

  <!-- soft glow -->
  <circle cx="400" cy="260" r="220" fill="#93c5fd" opacity="0.25"/>

  <!-- desk -->
  <rect x="60" y="480" width="680" height="16" rx="8" fill="#94a3b8"/>
  <rect x="60" y="496" width="680" height="6" rx="3" fill="#cbd5e1"/>

  <!-- desk clamp base -->
  <g>
    <rect x="330" y="470" width="140" height="18" rx="6" fill="#475569"/>
    <rect x="345" y="452" width="26" height="30" rx="4" fill="#334155"/>
    <rect x="429" y="452" width="26" height="30" rx="4" fill="#334155"/>
    <rect x="352" y="440" width="96" height="16" rx="6" fill="#334155"/>
    <circle cx="400" cy="448" r="7" fill="#0056b3"/>
  </g>

  <!-- lower arm segment -->
  <g>
    <rect x="388" y="330" width="24" height="120" rx="12" fill="url(#aarm)" transform="rotate(8 400 390)"/>
    <circle cx="400" cy="330" r="16" fill="#334155"/>
    <circle cx="400" cy="330" r="8" fill="#94a3b8"/>
  </g>

  <!-- upper arm segment -->
  <g>
    <rect x="300" y="180" width="22" height="150" rx="11" fill="url(#aarm)" transform="rotate(-28 311 255)"/>
    <circle cx="311" cy="252" r="15" fill="#334155"/>
    <circle cx="311" cy="252" r="7" fill="#94a3b8"/>
  </g>

  <!-- VESA mount plate -->
  <rect x="440" y="150" width="60" height="80" rx="8" fill="#334155" transform="rotate(-28 470 190)"/>

  <!-- monitor -->
  <g transform="rotate(-8 540 140)">
    <rect x="480" y="60" width="220" height="140" rx="12" fill="#0f172a"/>
    <rect x="492" y="72" width="196" height="116" rx="6" fill="url(#ascreen)"/>
    <!-- screen content: abstract chart -->
    <polyline points="510,160 545,140 575,150 610,115 645,125 675,95" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="675" cy="95" r="6" fill="#e0f2fe"/>
    <rect x="510" y="88" width="60" height="8" rx="4" fill="#7dd3fc" opacity="0.7"/>
    <rect x="510" y="104" width="40" height="6" rx="3" fill="#7dd3fc" opacity="0.4"/>
    <!-- stand neck -->
    <rect x="578" y="200" width="24" height="30" rx="6" fill="#475569"/>
    <!-- base of monitor -->
    <rect x="540" y="228" width="100" height="12" rx="6" fill="#334155"/>
  </g>

  <!-- cable -->
  <path d="M560 250 C560 320 480 340 430 360 C400 372 395 420 390 470" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

  <!-- decorative dots -->
  <g fill="#60a5fa">
    <circle cx="140" cy="140" r="5" opacity="0.5"/>
    <circle cx="660" cy="100" r="4" opacity="0.4"/>
    <circle cx="720" cy="300" r="5" opacity="0.4"/>
    <circle cx="120" cy="330" r="4" opacity="0.35"/>
    <circle cx="680" cy="430" r="4" opacity="0.3"/>
  </g>
</svg>
