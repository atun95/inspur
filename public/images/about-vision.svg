<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#0d2b52"/>
    </linearGradient>
    <linearGradient id="vbeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="vglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#vbg)"/>

  <!-- grid -->
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 150H1200M0 300H1200M0 450H1200M0 600H1200M0 750H1200"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900"/>
  </g>

  <circle cx="600" cy="430" r="330" fill="url(#vglow)"/>

  <!-- orbit rings -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 8">
    <ellipse cx="600" cy="430" rx="420" ry="150"/>
    <ellipse cx="600" cy="430" rx="330" ry="110" transform="rotate(-18 600 430)"/>
    <ellipse cx="600" cy="430" rx="230" ry="75" transform="rotate(24 600 430)"/>
  </g>

  <!-- rising bars -->
  <g>
    <rect x="180" y="640" width="90" height="160" rx="8" fill="#0b2a52" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="320" y="560" width="90" height="240" rx="8" fill="#0b2a52" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="460" y="470" width="90" height="330" rx="8" fill="#0e3a6e" stroke="#38bdf8" stroke-opacity="0.5"/>
    <rect x="600" y="380" width="90" height="420" rx="8" fill="#12508f" stroke="#38bdf8" stroke-opacity="0.6"/>
    <rect x="740" y="290" width="90" height="510" rx="8" fill="#1a6fd0" stroke="#7dd3fc" stroke-opacity="0.8"/>
    <rect x="880" y="200" width="90" height="600" rx="8" fill="url(#vbeam)" stroke="#7dd3fc" stroke-opacity="0.9"/>
  </g>

  <!-- trend line -->
  <path d="M225 620 L365 540 L505 450 L645 360 L785 270 L925 180" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="225" cy="620" r="8" fill="#7dd3fc"/>
  <circle cx="365" cy="540" r="8" fill="#7dd3fc"/>
  <circle cx="505" cy="450" r="8" fill="#7dd3fc"/>
  <circle cx="645" cy="360" r="8" fill="#7dd3fc"/>
  <circle cx="785" cy="270" r="9" fill="#38bdf8"/>
  <circle cx="925" cy="180" r="12" fill="#38bdf8">
    <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- star at peak -->
  <path d="M925 120 l10 22 24 3 -17 17 4 24 -21 -11 -21 11 4 -24 -17 -17 24 -3 z" fill="#e0f2fe" opacity="0.9"/>

  <!-- particles -->
  <g fill="#7dd3fc">
    <circle cx="150" cy="200" r="3" opacity="0.6"/>
    <circle cx="300" cy="120" r="2.5" opacity="0.5"/>
    <circle cx="1050" cy="300" r="3" opacity="0.6"/>
    <circle cx="1120" cy="520" r="2.5" opacity="0.5"/>
    <circle cx="90" cy="480" r="3" opacity="0.5"/>
    <circle cx="1080" cy="700" r="3" opacity="0.5"/>
  </g>
</svg>
